name: Trigger Android Build

on:
  push:
    branches:
      - main
    paths:
      - 'Core/**'
      - 'GeneralsMD/**'
      - 'Dependencies/**'
      - 'cmake/**'
      - 'android/**'
      - 'scripts/build/android/**'
      - 'Patches/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch optimized Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-android-fast.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
